<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 다이어리 스튜디오</title>
<style>
:root{--ink:#282720;--paper:#fffdf6;--line:#e7e2d4;--pink:#f3d8d1;--blue:#dce8e9;--green:#e0e8d8;--yellow:#f3e8bd}
*{box-sizing:border-box}body{margin:0;background:#f4f1e8;color:var(--ink);font-family:ui-rounded,"Apple SD Gothic Neo",Pretendard,system-ui,sans-serif}
header{padding:28px 18px 20px;text-align:center}header .eyebrow{font-size:12px;letter-spacing:.18em;color:#7f806f}h1{font-size:clamp(25px,5vw,36px);margin:8px 0;font-weight:850}header p{margin:0;color:#77766d;font-size:14px}
main{width:min(1120px,calc(100% - 28px));margin:0 auto 50px;display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:#fff;border:1px solid #e8e4da;border-radius:20px;padding:20px;box-shadow:0 5px 20px #34311a08}.panel h2{font-size:17px;margin:0 0 15px}.field{display:block;margin:15px 0 7px;font-size:13px;font-weight:750}.hint{font-size:12px;color:#858478;line-height:1.5}.input,textarea,select{width:100%;border:1px solid #e2dfd5;border-radius:12px;background:#fffefa;padding:12px;color:var(--ink);font:inherit;outline-color:#a4b3a0}textarea{min-height:140px;resize:vertical;line-height:1.65}.filebox{display:block;border:1px dashed #c9c5b8;border-radius:14px;padding:16px;text-align:center;background:#faf9f3;cursor:pointer}.filebox input{max-width:100%;font-size:12px}.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#33382d;color:white;width:100%;margin-top:16px}.secondary{background:#eeede5;color:#33382d}.btn:disabled{opacity:.5;cursor:wait}.status{font-size:13px;line-height:1.5;color:#6c715e;min-height:20px;margin-top:10px}.layout-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}.layout-option{border:1px solid #e5e1d6;border-radius:14px;background:#fff;padding:8px;text-align:left;cursor:pointer;color:inherit}.layout-option.active{border:2px solid #66755c;padding:7px;background:#f6f8f1}.mini{height:90px;border-radius:8px;background-color:#fffdf6;background-image:linear-gradient(#e8e4d8 1px,transparent 1px),linear-gradient(90deg,#e8e4d8 1px,transparent 1px);background-size:12px 12px;position:relative;overflow:hidden;margin-bottom:8px}.mini span{position:absolute;display:block;background:#d9d8ca;border:1px solid #5b5b4d;border-radius:4px}.mini.one span:first-child{left:8%;top:18%;width:40%;height:64%}.mini.one span:last-child{right:8%;top:25%;width:34%;height:48%;background:#d9e5d7}.mini.two span:first-child{left:12%;top:10%;width:76%;height:24%;background:#f0dfad}.mini.two span:last-child{left:23%;top:43%;width:54%;height:48%;background:#d9e5d7}.mini.three span:first-child{left:8%;top:14%;width:36%;height:72%;background:#d9e5d7}.mini.three span:last-child{right:8%;top:14%;width:40%;height:72%;background:#f2ded7}.mini.four span:first-child{left:10%;top:16%;width:52%;height:58%;background:#d9e5d7}.mini.four span:last-child{right:8%;bottom:10%;width:35%;height:32%;background:#f0dfad}.layout-name{font-size:13px;font-weight:800}.layout-desc{font-size:11px;color:#888579;margin-top:3px;line-height:1.35}
.preview-wrap{background:#ebe7dc;border-radius:16px;padding:14px;overflow:auto}.page{width:min(100%,600px);min-width:280px;aspect-ratio:0.72;margin:0 auto;background-color:var(--paper);background-image:linear-gradient(#e9e4d8 1px,transparent 1px),linear-gradient(90deg,#e9e4d8 1px,transparent 1px);background-size:22px 22px;border:1px solid #e0dccc;box-shadow:0 5px 20px #39362715;padding:7%;position:relative;overflow:hidden;color:#292a25}.page-date{font-size:clamp(9px,1.5vw,13px);letter-spacing:.1em;color:#8a887a}.page-title{font-size:clamp(19px,3.2vw,29px);line-height:1.2;font-weight:900;margin:5% 0 4%;overflow-wrap:anywhere}.page-note{white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(10px,1.55vw,14px);line-height:1.75}.page-image{object-fit:contain;max-width:100%;max-height:100%;filter:none}.sticker-frame{display:flex;align-items:center;justify-content:center;min-height:80px}.sticker-frame img{width:100%;height:100%;object-fit:contain}.page-tag{display:inline-block;border:1.5px solid #2e3028;border-radius:50px;padding:4px 10px;font-size:clamp(9px,1.2vw,12px);background:#f5e7bb;transform:rotate(-3deg);margin:4% 0}.page-layout{height:84%;display:grid;gap:5%;min-height:0}.page-layout.l1{grid-template-columns:1.1fr .9fr}.page-layout.l1 .sticker-frame{align-self:center}.page-layout.l2{grid-template-rows:auto 1fr}.page-layout.l2 .sticker-frame{height:100%;padding:0 12%}.page-layout.l3{grid-template-columns:.95fr 1.05fr;align-items:center}.page-layout.l3 .note-area{background:#fffdf4d9;border:1px solid #dcd5c4;border-radius:4px;padding:8%;transform:rotate(-1deg)}.page-layout.l4{grid-template-columns:1fr;grid-template-rows:1fr auto}.page-layout.l4 .sticker-frame{height:100%;padding:0 14%}.page-layout.l4 .note-area{background:#fffdf3df;border:1px solid #ded8c9;border-radius:4px;padding:4% 6%;transform:rotate(1deg)}.placeholder{height:100%;border:1px dashed #c9c3b3;border-radius:12px;display:grid;place-items:center;text-align:center;padding:10px;color:#999583;font-size:12px}.preview-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end}.preview-actions .btn{font-size:13px}.hidden{display:none!important}
@media(max-width:780px){main{grid-template-columns:1fr;width:min(600px,calc(100% - 20px))}.panel{padding:16px}.preview-wrap{padding:8px}.page{width:100%}header{padding-top:22px}}
</style>
</head>
<body>
<header><div class="eyebrow">MY LITTLE MEMORY BOOK</div><h1>나의 다이어리 스튜디오</h1><p>오늘의 이야기를, 손그림 한 페이지로 남겨요.</p></header>
<main>
<section class="panel">
<h2>1. 오늘의 기록</h2>
<label class="field" for="entryDate">날짜</label><input class="input" id="entryDate" type="date">
<label class="field" for="entryTitle">오늘을 한마디로</label><input class="input" id="entryTitle" maxlength="42" placeholder="예: 바람 좋았던 오후">
<label class="field" for="entryText">오늘 있었던 일</label><textarea id="entryText" placeholder="기억하고 싶은 순간이나 오늘의 기분을 편하게 적어 주세요. 적은 내용을 임의로 늘리지 않아요."></textarea>
<label class="field">오늘의 사진</label><div class="filebox"><input id="photo" type="file" accept="image/*"><div class="hint" style="margin-top:8px">사진 한 장을 골라 손그림 스티커로 바꿔요.</div></div>
<label class="field" for="mood">오늘의 기분</label><select id="mood" class="input"><option value="기록">담담한 기록</option><option value="행복">행복한 하루</option><option value="설렘">설레는 순간</option><option value="휴식">느긋한 휴식</option><option value="감사">고마운 마음</option><option value="복잡">복잡했던 하루</option></select>
<button class="btn primary" id="makeBtn">사진을 손그림으로 바꾸기</button><div id="status" class="status" role="status"></div>
<p class="hint">사진은 이미지 생성 API로 전송되어 손그림으로 변환돼요. 일기 문장은 이 화면에서만 배치하며, 입력한 내용 자체를 자동으로 덧붙이지 않아요.</p>
</section>
<section class="panel">
<h2>2. 페이지 레이아웃 고르기</h2>
<div class="layout-grid" id="layoutGrid">
<button class="layout-option active" data-layout="l1"><div class="mini one"><span></span><span></span></div><div class="layout-name">01 · 글 + 스티커</div><div class="layout-desc">글은 왼쪽, 그림은 오른쪽</div></button>
<button class="layout-option" data-layout="l2"><div class="mini two"><span></span><span></span></div><div class="layout-name">02 · 사진 중심</div><div class="layout-desc">제목 아래에 큰 그림</div></button>
<button class="layout-option" data-layout="l3"><div class="mini three"><span></span><span></span></div><div class="layout-name">03 · 두 칸 기록</div><div class="layout-desc">메모와 그림을 나란히</div></button>
<button class="layout-option" data-layout="l4"><div class="mini four"><span></span><span></span></div><div class="layout-name">04 · 스티커 메모</div><div class="layout-desc">아래쪽 메모지에 글 담기</div></button>
</div>
<h2>3. 미리보기</h2>
<div class="preview-wrap"><article class="page" id="page">
<div class="page-date" id="outDate"></div><div class="page-title" id="outTitle">오늘의 작은 기록</div>
<div class="page-layout l1" id="pageLayout">
<div class="note-area"><div class="page-tag" id="outMood">오늘의 기록</div><div class="page-note" id="outText">왼쪽에 오늘의 이야기가 표시돼요. 위에서 짧은 제목과 일기를 적어 보세요.</div></div>
<div class="sticker-frame" id="stickerFrame"><div class="placeholder">사진을 손그림으로<br>변환하면 여기에 보여요.</div></div>
</div></article></div>
<div class="preview-actions"><button class="btn secondary" id="resetBtn">초기화</button><button class="btn primary" style="width:auto;margin:0" id="downloadBtn">다이어리 PNG 저장</button></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let selectedLayout='l1', stickerUrl='';
const today=new Date(); $('entryDate').value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');
function updatePreview(){
 const title=$('entryTitle').value.trim(); $('outTitle').textContent=title||'오늘의 작은 기록';
 $('outDate').textContent=$('entryDate').value.replaceAll('-',' . ')||'오늘의 기록';
 $('outText').textContent=$('entryText').value.trim()||'왼쪽에 오늘의 이야기가 표시돼요. 위에서 짧은 제목과 일기를 적어 보세요.';
 $('outMood').textContent=$('mood').value;
 $('pageLayout').className='page-layout '+selectedLayout;
}
['entryDate','entryTitle','entryText','mood'].forEach(id=>$(id).addEventListener('input',updatePreview));
document.querySelectorAll('.layout-option').forEach(btn=>btn.addEventListener('click',()=>{
 selectedLayout=btn.dataset.layout;document.querySelectorAll('.layout-option').forEach(b=>b.classList.toggle('active',b===btn));updatePreview();
}));
$('makeBtn').addEventListener('click',async()=>{
 const file=$('photo').files[0]; if(!file){$('status').textContent='먼저 변환할 사진을 선택해 주세요.';return}
 if(!file.type.startsWith('image/')){$('status').textContent='이미지 파일을 선택해 주세요.';return}
 $('makeBtn').disabled=true;$('status').textContent='사진을 손그림으로 바꾸는 중이에요. 잠시 기다려 주세요…';
 try{
  const compressed=await compressImage(file);
  const response=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(compressed)});
  const data=await response.json();if(!response.ok)throw new Error(data.error||'이미지 변환에 실패했어요.');
  stickerUrl='data:'+(data.mimeType||'image/jpeg')+';base64,'+data.image;
  $('stickerFrame').innerHTML='';const img=document.createElement('img');img.alt='손그림 스티커';img.src=stickerUrl;$('stickerFrame').appendChild(img);
  $('status').textContent='완료! 네 가지 중 마음에 드는 레이아웃을 고르고 PNG로 저장해 봐.';
 }catch(e){$('status').textContent=e.message||'오류가 발생했어요. 다시 시도해 주세요.'}
 finally{$('makeBtn').disabled=false}
});
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('사진을 읽지 못했어요.'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('이미지를 열 수 없어요.'));img.onload=()=>{const scale=Math.min(1,1200/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve({image:canvas.toDataURL('image/jpeg',.82).split(',')[1],mimeType:'image/jpeg'})};img.src=reader.result};reader.readAsDataURL(file)})}
$('downloadBtn').addEventListener('click',async()=>{
 if(!window.html2canvas){$('status').textContent='저장 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.';return}
 const btn=$('downloadBtn');btn.disabled=true;
 try{const canvas=await html2canvas($('page'),{scale:2,backgroundColor:'#fffdf6',useCORS:true});const a=document.createElement('a');a.download='my-diary-'+($('entryDate').value||'page')+'.png';a.href=canvas.toDataURL('image/png');a.click();$('status').textContent='다이어리 페이지를 PNG로 저장했어요.'}
 catch(e){$('status').textContent='저장에 실패했어요. 페이지를 새로고침하고 다시 시도해 주세요.'}
 finally{btn.disabled=false}
});
$('resetBtn').addEventListener('click',()=>{if(!confirm('입력한 기록과 변환 이미지를 초기화할까요?'))return;$('entryTitle').value='';$('entryText').value='';$('photo').value='';$('mood').value='기록';stickerUrl='';$('stickerFrame').innerHTML='<div class="placeholder">사진을 손그림으로<br>변환하면 여기에 보여요.</div>';$('status').textContent='';selectedLayout='l1';document.querySelectorAll('.layout-option').forEach(b=>b.classList.toggle('active',b.dataset.layout==='l1'));updatePreview()});
updatePreview();
</script>
</body></html>
