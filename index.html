<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5ef">
<title>Diary Doodle Studio · 나만의 낙서 이미지</title>
<style>
:root{--ink:#25231f;--paper:#fbf8f2;--card:#fffdf9;--muted:#777168;--line:#e9e1d6;--accent:#d9e8d4;--pink:#f5dedb}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.55}main{width:min(760px,100%);margin:auto;padding:28px 18px 56px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:800;text-transform:uppercase}h1{font-size:clamp(30px,7vw,46px);letter-spacing:-.06em;line-height:1.08;margin:12px 0}h1 span{background:linear-gradient(transparent 63%,#e2ead8 63%);padding:0 4px}.lead{color:#625d55;max-width:560px;margin:14px 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin:16px 0;box-shadow:0 6px 22px #473a2208}.step{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:18px;font-weight:800}.num{display:grid;place-items:center;width:30px;height:30px;background:var(--accent);border-radius:50%;font-size:14px}
.upload{display:flex;align-items:center;justify-content:center;text-align:center;min-height:150px;border:1.5px dashed #c9c0b3;border-radius:18px;background:#fcfaf5;padding:22px;cursor:pointer}.upload:hover{background:#f6f4ec}.upload input{display:none}.upload strong{display:block;font-size:16px}.upload small{display:block;color:var(--muted);margin-top:5px}
.preview,.result{display:none;margin-top:14px;text-align:center}.preview img,.result img{max-width:100%;max-height:440px;border-radius:14px;object-fit:contain;background-color:#f5f1e9;background-image:linear-gradient(45deg,#e8e3dc 25%,transparent 25%),linear-gradient(-45deg,#e8e3dc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e8e3dc 75%),linear-gradient(-45deg,transparent 75%,#e8e3dc 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.btn{border:0;border-radius:999px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:8px}.primary{background:var(--ink);color:white}.secondary{background:var(--accent);color:var(--ink)}.btn:disabled{opacity:.5;cursor:wait}.note{font-size:13px;color:var(--muted);margin:12px 2px 0}.status{font-size:14px;font-weight:650;margin-top:12px;min-height:1.5em}footer{text-align:center;font-size:12px;color:var(--muted);padding-top:18px}
</style></head><body><main>
<div class="eyebrow">A tiny creative corner · 01</div><h1>사진 한 장으로<br><span>다이어리 낙서 이미지</span></h1>
<p class="lead">사진을 올리면 정해둔 손그림 다이어리 스타일로 자동 변환해요. 인물뿐 아니라 동물, 음식, 사물, 식물, 풍경에도 같은 그림체를 적용합니다.</p>
<section class="card"><h2 class="step"><span class="num">1</span> 사진 선택하기</h2>
<label class="upload" for="photo"><span><strong>＋ 사진을 선택하거나 눌러 주세요</strong><small>JPG · PNG · WEBP · 사진은 변환을 위해 Gemini로 전송됩니다.</small></span><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
<div class="preview" id="preview"><img id="previewImg" alt="선택한 사진 미리보기"></div><p class="note">선택한 사진은 이미지 변환 요청에 사용됩니다. API 키는 이 페이지에 공개되지 않아요.</p></section>
<section class="card"><h2 class="step"><span class="num">2</span> 낙서 이미지 만들기</h2>
<button class="btn primary" id="generate" disabled>✦ 자동으로 변환하기</button><p class="status" id="status" aria-live="polite">먼저 사진을 선택해 주세요.</p>
<div class="result" id="result"><img id="resultImg" alt="생성된 다이어리 낙서 이미지"><div class="actions"><a class="btn secondary" id="download" download="diary-doodle.png">↓ PNG 저장하기</a></div></div>
</section><footer>Diary Doodle Studio · 생성 결과는 자동 저장되지 않아요.</footer></main>
<script>
const photo=document.getElementById('photo'),preview=document.getElementById('preview'),previewImg=document.getElementById('previewImg'),generate=document.getElementById('generate'),status=document.getElementById('status'),result=document.getElementById('result'),resultImg=document.getElementById('resultImg'),download=document.getElementById('download');
let selectedFile=null,previewUrl=null,resultUrl=null;
function loadImage(file){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=URL.createObjectURL(file)})}
async function prepareUpload(file){const img=await loadImage(file);const scale=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',0.82).split(',')[1]}
function convertToPng(dataUrl){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;canvas.getContext('2d').drawImage(img,0,0);resolve(canvas.toDataURL('image/png'))};img.onerror=reject;img.src=dataUrl})}
photo.addEventListener('change',()=>{const f=photo.files&&photo.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){status.textContent='JPG, PNG 또는 WEBP 이미지 파일을 선택해 주세요.';return}if(f.size>12*1024*1024){status.textContent='사진 크기는 12MB 이하로 선택해 주세요.';return}selectedFile=f;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(f);previewImg.src=previewUrl;preview.style.display='block';generate.disabled=false;result.style.display='none';status.textContent='사진이 준비됐어요. 자동 변환을 눌러 주세요.'});
generate.addEventListener('click',async()=>{if(!selectedFile)return;generate.disabled=true;generate.textContent='변환 중…';status.textContent='그림체를 적용하고 있어요. 잠시 기다려 주세요.';result.style.display='none';try{const data=await prepareUpload(selectedFile);const response=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:data,mimeType:'image/jpeg'})});const responseText=await response.text();let payload;try{payload=JSON.parse(responseText)}catch{throw new Error('서버 응답을 읽지 못했어요. 사진을 더 작게 하거나 잠시 후 다시 시도해 주세요. ('+response.status+')')}if(!response.ok)throw new Error(payload.error||'이미지 생성에 실패했어요.');if(!payload.image)throw new Error('응답에서 이미지 결과를 찾지 못했어요.');if(resultUrl)URL.revokeObjectURL(resultUrl);const generatedUrl='data:'+(payload.mimeType||'image/jpeg')+';base64,'+payload.image;resultUrl=await convertToPng(generatedUrl);resultImg.src=resultUrl;download.href=resultUrl;download.download='diary-doodle.png';result.style.display='block';status.textContent='완성됐어요! 아래에서 PNG를 저장해 주세요.'}catch(e){status.textContent=e.message||'오류가 발생했어요. 잠시 후 다시 시도해 주세요.'}finally{generate.disabled=false;generate.textContent='✦ 다시 변환하기'}});
</script></body></html>
